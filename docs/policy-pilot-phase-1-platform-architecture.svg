<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Policy Pilot V2 Phase 1 Platform Architecture</title>
  <desc id="desc">Component architecture for the React frontend, NestJS backend, BullMQ workers, PostgreSQL with pgvector, Redis, OpenAI, entitlement registry, policy corpus, and downstream system.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".12"/></filter>
    <style>
      .t{font:700 30px 'Segoe UI',Arial;fill:#0f172a}.st{font:16px 'Segoe UI',Arial;fill:#475569}
      .zt{font:700 18px 'Segoe UI',Arial;fill:#1e293b}.nt{font:700 15px 'Segoe UI',Arial;fill:#0f172a}
      .tx{font:13px 'Segoe UI',Arial;fill:#334155}.sm{font:11px 'Segoe UI',Arial;fill:#475569}
      .box{fill:#fff;stroke-width:2;filter:url(#s)}.e{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}
      .eb{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#b)}.ed{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a)}
      .el{font:600 11px 'Segoe UI',Arial;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:4px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="40" y="48" class="t">Phase 1 — Platform &amp; Tech-Stack Architecture</text>
  <text x="40" y="76" class="st">Component boundaries and integrations. NestJS APIs, services, workers and schedulers run in one backend deployment.</text>

  <!-- Consumers -->
  <rect x="30" y="110" width="210" height="700" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="50" y="142" class="zt">CONSUMERS</text>
  <rect x="55" y="205" width="160" height="95" rx="10" class="box" stroke="#6366f1"/>
  <text x="135" y="237" text-anchor="middle" class="nt">HR / ITSM</text><text x="135" y="262" text-anchor="middle" class="tx">Webhook caller</text><text x="135" y="283" text-anchor="middle" class="sm">API-key credential</text>
  <rect x="55" y="395" width="160" height="120" rx="10" class="box" stroke="#6366f1"/>
  <text x="135" y="427" text-anchor="middle" class="nt">Browser users</text><text x="135" y="453" text-anchor="middle" class="tx">Reviewer</text><text x="135" y="477" text-anchor="middle" class="tx">Governance approver</text><text x="135" y="499" text-anchor="middle" class="sm">Role-based bearer token</text>

  <!-- Web -->
  <rect x="270" y="110" width="245" height="700" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="290" y="142" class="zt">WEB CONTAINER</text>
  <rect x="300" y="205" width="185" height="95" rx="10" class="box" stroke="#3b82f6"/>
  <text x="392" y="237" text-anchor="middle" class="nt">Nginx</text><text x="392" y="262" text-anchor="middle" class="tx">Serves production SPA</text><text x="392" y="283" text-anchor="middle" class="sm">Docker port 8080</text>
  <rect x="300" y="365" width="185" height="210" rx="10" class="box" stroke="#3b82f6"/>
  <text x="392" y="399" text-anchor="middle" class="nt">React 19 + Vite</text><text x="392" y="426" text-anchor="middle" class="tx">TanStack Query</text><text x="392" y="453" text-anchor="middle" class="tx">Reviewer dashboard</text><text x="392" y="480" text-anchor="middle" class="tx">Governance queue</text><text x="392" y="507" text-anchor="middle" class="tx">Protected routes</text><text x="392" y="544" text-anchor="middle" class="sm">HTTP → /api/v1</text>

  <!-- Backend -->
  <rect x="545" y="110" width="640" height="700" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="565" y="142" class="zt">NESTJS BACKEND CONTAINER</text><text x="1160" y="142" text-anchor="end" class="sm">Node.js 24 • Prisma • one process</text>
  <rect x="575" y="170" width="580" height="130" rx="11" class="box" stroke="#22c55e"/>
  <text x="595" y="198" class="nt">HTTP interface</text>
  <rect x="595" y="215" width="125" height="58" rx="7" fill="#ecfdf5" stroke="#86efac"/><text x="657" y="240" text-anchor="middle" class="nt">Ingestion API</text><text x="657" y="259" text-anchor="middle" class="sm">API key</text>
  <rect x="735" y="215" width="125" height="58" rx="7" fill="#ecfdf5" stroke="#86efac"/><text x="797" y="240" text-anchor="middle" class="nt">Review API</text><text x="797" y="259" text-anchor="middle" class="sm">REVIEWER</text>
  <rect x="875" y="215" width="135" height="58" rx="7" fill="#ecfdf5" stroke="#86efac"/><text x="942" y="240" text-anchor="middle" class="nt">Governance API</text><text x="942" y="259" text-anchor="middle" class="sm">APPROVER</text>
  <rect x="1025" y="215" width="105" height="58" rx="7" fill="#ecfdf5" stroke="#86efac"/><text x="1077" y="240" text-anchor="middle" class="nt">Health API</text><text x="1077" y="259" text-anchor="middle" class="sm">live / ready</text>

  <rect x="575" y="325" width="580" height="220" rx="11" class="box" stroke="#22c55e"/>
  <text x="595" y="353" class="nt">Domain and AI services</text>
  <rect x="595" y="375" width="165" height="62" rx="7" fill="#f0fdf4" stroke="#86efac"/><text x="677" y="400" text-anchor="middle" class="nt">Entitlement lookup</text><text x="677" y="420" text-anchor="middle" class="sm">Holdings + SoD facts</text>
  <rect x="775" y="375" width="165" height="62" rx="7" fill="#f0fdf4" stroke="#86efac"/><text x="857" y="400" text-anchor="middle" class="nt">Policy RAG</text><text x="857" y="420" text-anchor="middle" class="sm">pgvector retrieval</text>
  <rect x="955" y="375" width="175" height="62" rx="7" fill="#fff7ed" stroke="#fdba74"/><text x="1042" y="400" text-anchor="middle" class="nt">Agent v6</text><text x="1042" y="420" text-anchor="middle" class="sm">gpt-4o-mini JSON</text>
  <rect x="595" y="455" width="165" height="62" rx="7" fill="#f0fdf4" stroke="#86efac"/><text x="677" y="480" text-anchor="middle" class="nt">Precedent services</text><text x="677" y="500" text-anchor="middle" class="sm">Govern + retrieve</text>
  <rect x="775" y="455" width="165" height="62" rx="7" fill="#fef2f2" stroke="#fca5a5"/><text x="857" y="480" text-anchor="middle" class="nt">Grounding gate</text><text x="857" y="500" text-anchor="middle" class="sm">Deterministic checks</text>
  <rect x="955" y="455" width="175" height="62" rx="7" fill="#f0fdf4" stroke="#86efac"/><text x="1042" y="480" text-anchor="middle" class="nt">Decisions</text><text x="1042" y="500" text-anchor="middle" class="sm">Feedback + outbox</text>

  <rect x="575" y="570" width="580" height="205" rx="11" class="box" stroke="#22c55e"/>
  <text x="595" y="598" class="nt">BullMQ workers and schedulers</text>
  <rect x="595" y="620" width="165" height="72" rx="7" fill="#faf5ff" stroke="#c084fc"/><text x="677" y="646" text-anchor="middle" class="nt">Request worker</text><text x="677" y="667" text-anchor="middle" class="sm">Evidence + recommendation</text><text x="677" y="684" text-anchor="middle" class="sm">60 jobs/min</text>
  <rect x="775" y="620" width="165" height="72" rx="7" fill="#faf5ff" stroke="#c084fc"/><text x="857" y="646" text-anchor="middle" class="nt">Execution worker</text><text x="857" y="667" text-anchor="middle" class="sm">Lease + fencing</text><text x="857" y="684" text-anchor="middle" class="sm">Stable idempotency key</text>
  <rect x="955" y="620" width="175" height="72" rx="7" fill="#faf5ff" stroke="#c084fc"/><text x="1042" y="646" text-anchor="middle" class="nt">Precedent worker</text><text x="1042" y="667" text-anchor="middle" class="sm">Canonical embedding</text><text x="1042" y="684" text-anchor="middle" class="sm">PROPOSED record</text>
  <rect x="595" y="710" width="535" height="43" rx="7" fill="#f8fafc" stroke="#94a3b8"/><text x="862" y="728" text-anchor="middle" class="nt">Sweepers + pattern scheduler</text><text x="862" y="746" text-anchor="middle" class="sm">Recover lost work • pattern discovery every 30 minutes</text>

  <!-- Infrastructure -->
  <rect x="1215" y="110" width="355" height="700" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="1235" y="142" class="zt">DATA &amp; EXTERNAL</text>
  <rect x="1245" y="175" width="295" height="130" rx="10" class="box" stroke="#f97316"/>
  <text x="1392" y="205" text-anchor="middle" class="nt">PostgreSQL 16 + pgvector</text><text x="1392" y="231" text-anchor="middle" class="tx">Business state + append-only audit</text><text x="1392" y="255" text-anchor="middle" class="tx">Policy and precedent vectors</text><text x="1392" y="280" text-anchor="middle" class="sm">HNSW cosine indexes</text>
  <rect x="1245" y="335" width="295" height="125" rx="10" class="box" stroke="#f97316"/>
  <text x="1392" y="365" text-anchor="middle" class="nt">Redis 7 + BullMQ</text><text x="1392" y="391" text-anchor="middle" class="tx">Request • execution • precedent queues</text><text x="1392" y="415" text-anchor="middle" class="tx">Retries + backoff + stable job IDs</text><text x="1392" y="440" text-anchor="middle" class="sm">Workers share the NestJS process</text>
  <rect x="1245" y="490" width="295" height="95" rx="10" class="box" stroke="#f97316"/>
  <text x="1392" y="520" text-anchor="middle" class="nt">OpenAI APIs</text><text x="1392" y="546" text-anchor="middle" class="tx">Chat completion + embeddings</text><text x="1392" y="568" text-anchor="middle" class="sm">External probabilistic services</text>
  <rect x="1245" y="615" width="140" height="80" rx="10" class="box" stroke="#f97316"/><text x="1315" y="643" text-anchor="middle" class="nt">Policy corpus</text><text x="1315" y="667" text-anchor="middle" class="tx">Markdown + PDF</text><text x="1315" y="685" text-anchor="middle" class="sm">Ingestion CLI</text>
  <rect x="1400" y="615" width="140" height="80" rx="10" class="box" stroke="#f97316"/><text x="1470" y="643" text-anchor="middle" class="nt">Entitlements</text><text x="1470" y="667" text-anchor="middle" class="tx">Registry table</text><text x="1470" y="685" text-anchor="middle" class="sm">Authoritative</text>
  <rect x="1245" y="720" width="295" height="65" rx="10" class="box" stroke="#f97316"/><text x="1392" y="747" text-anchor="middle" class="nt">Downstream entitlement system</text><text x="1392" y="769" text-anchor="middle" class="sm">Mock adapter • execution worker only</text>

  <!-- Integrations -->
  <path d="M215 252H595" class="eb"/><text x="300" y="241" class="el">POST access request</text>
  <path d="M215 455H300" class="eb"/><path d="M392 365V300" class="e"/>
  <path d="M485 470H735" class="eb"/><text x="520" y="458" class="el">Review / governance HTTP</text>
  <path d="M1155 244H1245" class="e"/><text x="1170" y="232" class="el">Prisma</text>
  <path d="M1155 656H1200V397H1245" class="ed"/><text x="1165" y="640" class="el">BullMQ</text>
  <path d="M1130 406H1200V537H1245" class="e"/><text x="1160" y="395" class="el">Chat</text>
  <path d="M940 406H1180V555H1245" class="e"/><text x="1120" y="545" class="el">Embed</text>
  <path d="M1470 615V595H677V437" class="e"/><text x="1450" y="605" class="el">Lookup</text>
  <path d="M1315 615V600H857V437" class="ed"/><text x="1210" y="590" class="el">Parse • chunk • embed</text>
  <path d="M857 692V825H1392V785" class="eb"/><text x="1040" y="815" class="el">Human-authorized execution only</text>

  <text x="40" y="850" class="sm">Docker Compose deploys web, API, one-shot migration, PostgreSQL and Redis containers. Boxes inside the backend are logical modules and workers, not separate microservices.</text>
</svg>
