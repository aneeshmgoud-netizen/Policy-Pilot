<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000" role="img" aria-labelledby="title desc">
  <title id="title">Policy Pilot V2 Phase 2 Governed RAG over Historical Decisions</title>
  <desc id="desc">Architecture showing how reviewer feedback becomes governed precedent, how active precedents are retrieved for similar future requests, and how model output is checked by the deterministic grounding gate.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#15803d"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".12"/></filter>
    <style>
      .t{font:700 30px 'Segoe UI',Arial;fill:#0f172a}.st{font:16px 'Segoe UI',Arial;fill:#475569}
      .lt{font:700 18px 'Segoe UI',Arial;fill:#1e293b}.nt{font:700 15px 'Segoe UI',Arial;fill:#0f172a}
      .tx{font:13px 'Segoe UI',Arial;fill:#334155}.sm{font:11px 'Segoe UI',Arial;fill:#475569}
      .box{fill:#fff;stroke-width:2;filter:url(#s)}.e{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}
      .eb{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#b)}.eg{fill:none;stroke:#15803d;stroke-width:2.5;marker-end:url(#g)}
      .ed{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a)}
      .el{font:600 11px 'Segoe UI',Arial;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:4px}
    </style>
  </defs>
  <rect width="1700" height="1000" fill="#f8fafc"/>
  <text x="40" y="48" class="t">Phase 2 — Governed RAG over Historical Decisions</text>
  <text x="40" y="76" class="st">Reviewed cases become reusable knowledge through governed database state—not retraining, prompt deployment or application releases.</text>

  <!-- Knowledge creation -->
  <rect x="30" y="105" width="1640" height="350" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="55" y="137" class="lt">A. HISTORICAL-DECISION KNOWLEDGE LAYER</text>
  <rect x="55" y="180" width="205" height="140" rx="10" class="box" stroke="#22c55e"/>
  <text x="157" y="211" text-anchor="middle" class="nt">Reviewed case</text><text x="157" y="238" text-anchor="middle" class="tx">HumanDecision</text><text x="157" y="261" text-anchor="middle" class="tx">DecisionFeedback</text><text x="157" y="286" text-anchor="middle" class="sm">Outcome • reviewer • agreement</text><text x="157" y="304" text-anchor="middle" class="sm">reason • context • future-use</text>
  <rect x="310" y="180" width="205" height="140" rx="10" class="box" stroke="#a855f7"/>
  <text x="412" y="211" text-anchor="middle" class="nt">Precedent ingestion</text><text x="412" y="238" text-anchor="middle" class="tx">BullMQ queue + worker</text><text x="412" y="263" text-anchor="middle" class="sm">jobId = feedback ID</text><text x="412" y="286" text-anchor="middle" class="sm">Sweeper recovers missed jobs</text><text x="412" y="304" text-anchor="middle" class="sm">Idempotent materialization</text>
  <rect x="565" y="165" width="245" height="170" rx="10" class="box" stroke="#22c55e"/>
  <text x="687" y="196" text-anchor="middle" class="nt">Precedent materializer</text><text x="687" y="223" text-anchor="middle" class="tx">Deterministic audit summary</text><text x="687" y="247" text-anchor="middle" class="tx">Canonical request-facts text</text><text x="687" y="271" text-anchor="middle" class="tx">Policy-version snapshot</text><line x1="590" y1="287" x2="785" y2="287" stroke="#cbd5e1"/><text x="687" y="308" text-anchor="middle" class="sm">Outcome and reviewer commentary</text><text x="687" y="325" text-anchor="middle" class="sm">are excluded from similarity text</text>
  <rect x="860" y="180" width="195" height="140" rx="10" class="box" stroke="#fb923c"/>
  <text x="957" y="211" text-anchor="middle" class="nt">OpenAI embeddings</text><text x="957" y="238" text-anchor="middle" class="tx">text-embedding-3-small</text><text x="957" y="262" text-anchor="middle" class="tx">1536 dimensions</text><text x="957" y="288" text-anchor="middle" class="sm">Same canonical builder used</text><text x="957" y="306" text-anchor="middle" class="sm">for old and new requests</text>
  <rect x="1105" y="165" width="235" height="170" rx="10" class="box" stroke="#f97316"/>
  <text x="1222" y="196" text-anchor="middle" class="nt">precedent_records</text><text x="1222" y="223" text-anchor="middle" class="tx">PostgreSQL + pgvector</text><text x="1222" y="247" text-anchor="middle" class="tx">HNSW cosine index</text><text x="1222" y="271" text-anchor="middle" class="tx">Embedding version = 2</text><text x="1222" y="295" text-anchor="middle" class="tx">Status begins PROPOSED</text><text x="1222" y="318" text-anchor="middle" class="sm">PROPOSED is not retrievable</text>
  <rect x="1390" y="155" width="245" height="190" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#s)"/>
  <text x="1512" y="188" text-anchor="middle" class="nt">Governance boundary</text><text x="1512" y="215" text-anchor="middle" class="tx">Separate APPROVER role</text><text x="1512" y="239" text-anchor="middle" class="tx">Protected React page + API</text>
  <rect x="1415" y="260" width="90" height="52" rx="7" fill="#dcfce7" stroke="#16a34a"/><text x="1460" y="283" text-anchor="middle" class="nt">ACTIVE</text><text x="1460" y="302" text-anchor="middle" class="sm">retrieved</text>
  <rect x="1520" y="260" width="90" height="52" rx="7" fill="#fee2e2" stroke="#dc2626"/><text x="1565" y="283" text-anchor="middle" class="nt">REVOKED</text><text x="1565" y="302" text-anchor="middle" class="sm">excluded</text>
  <text x="1512" y="331" text-anchor="middle" class="sm">Transitions retained in audit log</text>
  <path d="M260 250H310" class="eb"/><text x="267" y="237" class="el">nominated</text><path d="M515 250H565" class="e"/><path d="M810 250H860" class="e"/><path d="M1055 250H1105" class="e"/><path d="M1340 250H1390" class="eb"/>

  <!-- Patterns and rules -->
  <rect x="55" y="365" width="1580" height="65" rx="9" fill="#fff" stroke="#86efac"/>
  <text x="78" y="392" class="nt">Pattern discovery</text><text x="78" y="414" class="sm">All decisions + active precedents + current policy versions</text>
  <rect x="330" y="378" width="250" height="40" rx="7" fill="#f0fdf4" stroke="#86efac"/><text x="455" y="403" text-anchor="middle" class="tx">Scheduled 30 min + manual trigger</text>
  <rect x="630" y="378" width="285" height="40" rx="7" fill="#f0fdf4" stroke="#86efac"/><text x="772" y="403" text-anchor="middle" class="tx">Recurring • inconsistent • outdated</text>
  <rect x="965" y="378" width="250" height="40" rx="7" fill="#eef2ff" stroke="#a5b4fc"/><text x="1090" y="403" text-anchor="middle" class="tx">Governance accept / dismiss</text>
  <rect x="1265" y="378" width="325" height="40" rx="7" fill="#dcfce7" stroke="#16a34a"/><text x="1427" y="403" text-anchor="middle" class="tx">ACTIVE OperatingRule • exact scope • revocable</text>
  <path d="M580 398H630" class="e"/><path d="M915 398H965" class="e"/><path d="M1215 398H1265" class="eg"/>

  <!-- Retrieval -->
  <rect x="30" y="485" width="1640" height="455" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="55" y="517" class="lt">B. FUTURE-REQUEST RAG &amp; GROUNDING ARCHITECTURE</text>
  <rect x="55" y="585" width="205" height="175" rx="10" class="box" stroke="#3b82f6"/>
  <text x="157" y="616" text-anchor="middle" class="nt">New request</text><text x="157" y="643" text-anchor="middle" class="tx">Canonical facts</text><text x="157" y="670" text-anchor="middle" class="sm">request type • system • entitlement</text><text x="157" y="691" text-anchor="middle" class="sm">title • department • cost center</text><text x="157" y="712" text-anchor="middle" class="sm">business justification</text><text x="157" y="741" text-anchor="middle" class="sm">Same representation as history</text>
  <rect x="310" y="585" width="205" height="175" rx="10" class="box" stroke="#fb923c"/>
  <text x="412" y="616" text-anchor="middle" class="nt">Query embedding</text><text x="412" y="643" text-anchor="middle" class="tx">OpenAI embeddings</text><text x="412" y="667" text-anchor="middle" class="tx">1536-dimensional vector</text><text x="412" y="698" text-anchor="middle" class="sm">No AI reasoning, outcome, IDs</text><text x="412" y="719" text-anchor="middle" class="sm">or reviewer text in query</text>
  <rect x="565" y="550" width="275" height="245" rx="10" class="box" stroke="#3b82f6"/>
  <text x="702" y="581" text-anchor="middle" class="nt">PrecedentRetrievalService</text><text x="590" y="614" class="tx">1. status = ACTIVE</text><text x="590" y="640" class="tx">2. exact system + entitlement</text><text x="590" y="666" class="tx">3. embedding_version = 2</text><text x="590" y="692" class="tx">4. cosine similarity &gt;= 0.75</text><text x="590" y="718" class="tx">5. policy snapshot not stale</text><text x="590" y="744" class="tx">6. return up to 3 best matches</text><text x="702" y="778" text-anchor="middle" class="sm">Filtering happens before the LLM</text>
  <rect x="890" y="535" width="230" height="120" rx="10" class="box" stroke="#f97316"/>
  <text x="1005" y="565" text-anchor="middle" class="nt">Formal policy RAG</text><text x="1005" y="592" text-anchor="middle" class="tx">policy_chunks • pgvector</text><text x="1005" y="616" text-anchor="middle" class="tx">HNSW vector retrieval</text><text x="1005" y="639" text-anchor="middle" class="sm">Backend-owned Source IDs</text>
  <rect x="890" y="680" width="230" height="120" rx="10" class="box" stroke="#f97316"/>
  <text x="1005" y="710" text-anchor="middle" class="nt">Governed knowledge</text><text x="1005" y="737" text-anchor="middle" class="tx">ACTIVE precedents • vector</text><text x="1005" y="761" text-anchor="middle" class="tx">ACTIVE rules • exact SQL</text><text x="1005" y="784" text-anchor="middle" class="sm">Revoked rows excluded</text>
  <rect x="1170" y="550" width="235" height="245" rx="10" class="box" stroke="#3b82f6"/>
  <text x="1287" y="581" text-anchor="middle" class="nt">v6 evidence assembly</text><text x="1195" y="614" class="tx">Entitlement snapshot</text><text x="1195" y="640" class="tx">Policy evidence segments</text><text x="1195" y="666" class="tx">Precedent summaries + outcomes</text><text x="1195" y="692" class="tx">Exact-scope operating rules</text><text x="1195" y="718" class="tx">Fenced requester justification</text><line x1="1195" y1="738" x2="1380" y2="738" stroke="#cbd5e1"/><text x="1287" y="761" text-anchor="middle" class="sm">Policy, precedent and rules remain</text><text x="1287" y="779" text-anchor="middle" class="sm">separate evidence categories</text>
  <rect x="1455" y="540" width="180" height="225" rx="10" class="box" stroke="#fb923c"/>
  <text x="1545" y="571" text-anchor="middle" class="nt">gpt-4o-mini</text><text x="1545" y="598" text-anchor="middle" class="tx">Decision + reasoning</text><text x="1545" y="622" text-anchor="middle" class="tx">Policy source refs</text><text x="1545" y="646" text-anchor="middle" class="tx">Precedent citations</text><text x="1545" y="670" text-anchor="middle" class="tx">precedent_review</text><text x="1545" y="694" text-anchor="middle" class="tx">operating_rule_review</text><text x="1545" y="718" text-anchor="middle" class="tx">conflict_detected</text><text x="1545" y="746" text-anchor="middle" class="sm">Zod schema • up to 3 attempts</text>
  <rect x="1080" y="840" width="390" height="75" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#s)"/>
  <text x="1275" y="867" text-anchor="middle" class="nt">RecommendationGroundingService</text><text x="1275" y="890" text-anchor="middle" class="tx">Materialize exact policy citations • verify every retrieved ID</text><text x="1275" y="908" text-anchor="middle" class="sm">Omission, applicable outcome contradiction or model conflict → ESCALATE</text>
  <rect x="1510" y="840" width="125" height="75" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#s)"/>
  <text x="1572" y="868" text-anchor="middle" class="nt">Persist</text><text x="1572" y="891" text-anchor="middle" class="tx">Effective result</text><text x="1572" y="908" text-anchor="middle" class="sm">Provenance</text>

  <!-- Retrieval integrations -->
  <path d="M260 672H310" class="eb"/><path d="M515 672H565" class="e"/><path d="M890 740H840" class="e"/><text x="842" y="728" class="el">candidate vectors</text>
  <path d="M840 672H1170" class="eb"/><text x="920" y="663" class="el">top 3 matching precedents</text><path d="M1120 595H1170" class="e"/><text x="1125" y="584" class="el">policy</text><path d="M1120 740H1170" class="e"/><text x="1125" y="729" class="el">rules</text>
  <path d="M1405 672H1455" class="eb"/><path d="M1545 765V810H1275V840" class="e"/><text x="1390" y="801" class="el">schema-valid output</text><path d="M1470 877H1510" class="eg"/>
  <path d="M1460 312V485H1005V680" class="ed"/><text x="1225" y="476" class="el">ACTIVE precedent available on next request</text>
  <path d="M1427 418V500H1080V680" class="ed"/><text x="1190" y="491" class="el">ACTIVE rule available with no deploy</text>

  <text x="40" y="965" class="sm">Governance invariant: reviewers nominate; only GOVERNANCE_APPROVER can activate. Revocation changes the next retrieval while preserving audit history.</text>
  <text x="40" y="985" class="sm">Boundary: the gate verifies operating-rule review completeness, but free-text rule meaning is not deterministically enforceable.</text>
</svg>
