services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: policy_pilot
      POSTGRES_PASSWORD: policy_pilot
      POSTGRES_DB: policy_pilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy_pilot -d policy_pilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Reuses the developer's existing backend/.env for secrets (OPENAI_API_KEY,
    # INGESTION_API_KEY, etc.); `required: false` lets the stack still come up
    # on a fresh clone that hasn't created one yet, though the app won't have
    # much to do without it. DATABASE_URL/REDIS_URL below intentionally
    # override anything in that file to point at the compose service names
    # instead of localhost.
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://policy_pilot:policy_pilot@postgres:5432/policy_pilot?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres_data:
